name: Bug report
description: Report a reproducible problem with Autonomous Budget.
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Autonomous Budget version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: homeassistant
    attributes:
      label: Home Assistant version
      placeholder: 2026.8.3
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use fictional names and amounts when possible.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove tokens, personal information, and financial data before sharing.
